<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GGN Check-in/Check-out</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background-color: #fdf5f7;
      color: #400000;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 10px;
      background-color: #ddd;
      border-radius: 50%;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .zone-title {
      margin: 0;
      font-size: 22px;
      color: #800000;
      margin-bottom: 5px;
      text-align: center;
    }

    .system-title {
      margin: 0;
      font-size: 18px;
      color: #800000;
      margin-bottom: 15px;
      text-align: center;
    }

    label {
      margin-right: 15px;
      font-weight: bold;
    }

    input[type="radio"] {
      margin-right: 5px;
    }

    select {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    input[type="file"],
    textarea,
    input[type="text"],
    button {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background-color: #800000;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #a00000;
    }

    #previewText {
      background: #fff5f5;
      border: 1px solid #d9b3b3;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 15px;
      margin-top: 10px;
    }

    #previewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    #previewContainer img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border: 2px solid #800000;
      border-radius: 6px;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      color: #800000;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="https://img2.pic.in.th/pic/logo-ggn.png" alt="โลโก้" />
  </div>

  <h2 class="zone-title">สำนักงาน เขตลำพูน ลำปาง กาญจนบุรี</h2>
  <h2 class="system-title">📷 ระบบ Check in / Check out</h2>

  <div>
    <label><input type="radio" name="jobType" value="Check in (เข้างาน)"> Check in (เข้างาน)</label>
    <label><input type="radio" name="jobType" value="Check out (ออกงาน)"> Check out (ออกงาน)</label>
  </div>

  <select id="location">
    <option value="">เลือกจุดปฏิบัติงาน</option>
    <option value="สำนักงานลำพูน">สำนักงานลำพูน</option>
    <option value="สำนักงานลำปาง">สำนักงานลำปาง</option>
    <option value="สำนักงานกาญจนบุรี">สำนักงานกาญจนบุรี</option>
  </select>

  <select id="fullname">
    <option value="">เลือกชื่อ-นามสกุล</option>
    <option value="นายดนุพล ยามดีเลิศ">นายดนุพล ยามดีเลิศ</option>
    <option value="นายดนุเดช จักวี">นายดนุเดช จักวี</option>
    <option value="นายเจนณรงค์ คนเที่ยง">นายเจนณรงค์ คนเที่ยง</option>
    <option value="นายจีระพันธ์ จันทร์แห่ว">นายจีระพันธ์ จันทร์แห่ว</option>
    <option value="นายบุญพร้อม แตงทองคำ">นายบุญพร้อม แตงทองคำ</option>
  </select>

<textarea id="text" rows="2" placeholder="ข้อความเพิ่มเติม (ถ้ามี)"></textarea>
  <div id="previewText"></div>
  <input type="file" id="imageInput" accept="image/jpeg,image/png" multiple />
  <button id="sendBtn">ส่งภาพเข้า Telegram</button>

  <div id="previewContainer"></div>
  <div id="status"></div>
  <canvas id="canvas"></canvas>

  <script>
    const botToken = "8814549886:AAHw1ttG9ADD4KAsU93d_7CCPQeDjI6Pkrc";
    const chatId = "-5357842423";

    const imageInput = document.getElementById("imageInput");
    const previewContainer = document.getElementById("previewContainer");
    const previewText = document.getElementById("previewText");
    const extraText = document.getElementById("text");
    const fullname = document.getElementById("fullname");
    const location = document.getElementById("location");
    const status = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let photos = [];

    function getSelectedJob() {
      const selected = document.querySelector('input[name="jobType"]:checked');
      return selected ? selected.value : "";
    }

    imageInput.addEventListener("change", (e) => {
      photos = Array.from(e.target.files).filter(file => {
        if (file.type === "image/heic" || file.name.endsWith(".heic")) {
          alert("ไม่รองรับไฟล์ .heic กรุณาใช้ .jpg หรือ .png");
          return false;
        }
        return true;
      });
      updatePreview();
    });

    function updatePreview() {
      previewContainer.innerHTML = "";
      photos.forEach(file => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        previewContainer.appendChild(img);
      });
    }

    function updatePreviewText() {
  const job = getSelectedJob() || "-";
  const extra = extraText.value.trim();
  const name = fullname.value || "-";
  const point = location.value || "-";
  const nowStr = new Date().toLocaleString("th-TH");

      previewText.textContent =
      `📅 ${nowStr}
      📍 จุดปฏิบัติงาน: ${point}
      👤 ผู้กรอก: ${name}
      📌 งาน: ${job}${extra ? `\n📝 ${extra}` : ""}`;
    }

    extraText.addEventListener("input", updatePreviewText);
    fullname.addEventListener("change", updatePreviewText);
    location.addEventListener("change", updatePreviewText);
    document.querySelectorAll('input[name="jobType"]').forEach(el => {
    el.addEventListener("change", updatePreviewText);
    });

    async function processImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.9);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    async function sendToTelegram() {
      const name = fullname.value;
      const point = location.value;
      const job = getSelectedJob();
      const extraMsg = extraText.value.trim();

     if (!point) {
        alert("กรุณาเลือกจุดปฏิบัติงาน");
        return;
    }

    if (!name) {
        alert("กรุณาเลือกชื่อผู้กรอก");
        return;
    }

      if (!job) {
        alert("กรุณาเลือกประเภทงาน");
        return;
      }

      if (photos.length === 0) {
        alert("กรุณาเลือกรูปภาพ");
        return;
      }

      updatePreviewText();
      const caption = previewText.textContent;

      for (let i = 0; i < photos.length; i++) {
        const blob = await processImage(photos[i]);
        const form = new FormData();
        form.append("chat_id", chatId);
        form.append("photo", blob, `photo${i + 1}.jpg`);
        form.append("caption", caption);

        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          body: form
        });
      }

      status.textContent = "✅ ส่งภาพสำเร็จแล้ว!";
      photos = [];
      updatePreview();
      previewText.textContent = "";
      extraText.value = "";
      fullname.selectedIndex = 0;
      location.selectedIndex = 0;
      document.querySelectorAll('input[name="jobType"]').forEach(el => el.checked = false);
    }

    document.getElementById("sendBtn").addEventListener("click", sendToTelegram);
  </script>
</body>
</html>
